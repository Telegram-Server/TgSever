name: CI

on:
  # Every branch push runs CI, not just the release branches. A feature branch
  # that never gets a run is a branch whose breakage is invisible until someone
  # opens a PR and waits; catching it at push time is the whole point of having
  # the workflow. Tags are excluded because they are not branch state.
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      # The committed sqlc output once fell behind the migrations for months:
      # every later regeneration dragged unrelated diffs into whoever ran it, so
      # people stopped regenerating and wrote SQL by hand instead. Fail the
      # moment the generated code no longer matches schema and queries.
      - name: Check sqlc output is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          "$(go env GOPATH)/bin/sqlc" diff

      # Postgres integration tests start a private PostgreSQL 17 per test
      # process (internal/store/postgres/pgtest): binaries are downloaded once
      # into .pgtest/ and the migrated data directory is snapshotted there, so
      # no service container is needed. Cache both between runs.
      - name: Cache pgtest PostgreSQL
        uses: actions/cache@v4
        with:
          path: |
            .pgtest/dist
            .pgtest/snapshots
          key: pgtest-${{ runner.os }}-${{ hashFiles('internal/store/postgres/pgtest/*.go', 'deploy/migrations/**') }}
          restore-keys: pgtest-${{ runner.os }}-

      - name: Test
        run: go test ./... -count=1

      - name: Verify legacy Compose credentials and volume upgrade
        env:
          TELESRV_RUN_COMPOSE_INTEGRATION: '1'
        run: go test ./deploy -run '^TestLegacyComposeCredentialsIntegration$' -count=1 -timeout=5m

  # The private PostgreSQL cluster has a Windows-specific path (binaries,
  # locale, process handling); exercise it end to end on a real Windows host.
  pgtest-windows:
    name: pgtest on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache pgtest PostgreSQL
        uses: actions/cache@v4
        with:
          path: |
            .pgtest/dist
            .pgtest/snapshots
          key: pgtest-${{ runner.os }}-${{ hashFiles('internal/store/postgres/pgtest/*.go', 'deploy/migrations/**') }}
          restore-keys: pgtest-${{ runner.os }}-

      - name: Test private PostgreSQL cluster
        run: go test ./internal/store/postgres/pgtest ./internal/store/postgres -count=1 -run "^(TestCloneStrategy|TestAuthKeyStoreRoundTrip|TestAuthSignUpWritesOfficialLoginMessagePostgres|TestChannelStoreEditMemberRank|TestPostgresAdmissionReservesCapacityBeforeOpeningBackend)$" -v

  admin-web:
    name: Admin web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/telesrv-admin/web/package-lock.json

      - name: Install dependencies
        working-directory: cmd/telesrv-admin/web
        run: npm ci

      - name: Build
        working-directory: cmd/telesrv-admin/web
        run: npm run build

      - name: Check the generated API-doc tables
        # docs/admin-panel-api.{en,ru}.md carry route and permission tables
        # generated from nav.ts / permissions.tsx / security.go. They drifted
        # badly once because nothing compared them to the source, so the check
        # is the whole point: it fails when a page or a right is added and the
        # docs are not regenerated with
        #   python3 scripts/gen_admin_panel_doc_tables.py --write
        run: python3 scripts/gen_admin_panel_doc_tables.py --check

  grammystore:
    name: Grammy store bot
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: grammystore_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d grammystore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/bots/grammystore/package-lock.json

      - name: Install dependencies
        working-directory: cmd/bots/grammystore
        run: npm ci

      - name: Check syntax
        working-directory: cmd/bots/grammystore
        run: npm run check

      - name: Test
        working-directory: cmd/bots/grammystore
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/grammystore_test
          BOT_TOKEN: "999:TEST"
          OWNER_IDS: "1"
          GRAMSRV_TOKEN: "test-token"
          CODE_WEBHOOK_SECRET: "abcdefghijklmnopqrstuvwxyz1234"
        run: npm test

  docker-smoke:
    name: Docker main topology smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate isolated environment
        run: ./scripts/new-docker-env.sh --advertise-ip 127.0.0.1

      - name: Validate deployment inputs
        run: |
          docker compose version
          sh -n scripts/new-docker-env.sh
          bash -n scripts/start-docker.sh
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          bash -n scripts/check-media.sh
          sh -n deploy/docker/docker-entrypoint.sh
          compose=(docker compose -p telesrv-main-ci --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml)
          bridge=("${compose[@]}" -f deploy/docker/compose.bridge-network.yaml)
          "${compose[@]}" config --quiet
          # Every path telesrv writes to must live on the /var/lib/telesrv volume.
          # The container rootfs is read_only, so a data path with a relative
          # default that compose forgets to pin kills the server at startup --
          # which is exactly how TELESRV_WALLET_STATE_DIR took the stack down once.
          # TELESRV_IDENTITY_DIR is written by the server and read by the admin
          # (which mounts the volume read-only), so both must name the same
          # directory on the volume -- with the relative default the panel's
          # server settings were silently never saved.
          "${compose[@]}" config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert s["server"].get("network_mode") == "host"; assert s["admin"].get("network_mode") == "host"; assert len(s["server"].get("ports", [])) == 0; assert len(s["admin"].get("ports", [])) == 0; assert str(s["server"]["environment"]["TELESRV_TURN_RELAY_MAX_PORT"]) == "12999"; _e = s["server"]["environment"]; assert _e["TELESRV_WALLET_STATE_DIR"].startswith("/var/lib/telesrv"); assert _e["TELESRV_WALLET_KEY_FILE"].startswith("/var/lib/telesrv"); _a = s["admin"]["environment"]; assert _e["TELESRV_IDENTITY_DIR"].startswith("/var/lib/telesrv"); assert _a["TELESRV_IDENTITY_DIR"].startswith("/var/lib/telesrv"); assert _e["TELESRV_IDENTITY_DIR"] == _a["TELESRV_IDENTITY_DIR"]'
          # Desktop updates stay off by default (a non-empty manifest turns the
          # in-process service on), and the update volume is the only writable
          # mount the server gains. The update root public key comes from a
          # read-only bind of deploy/docker/update-keys, never from that volume.
          # APNs push is off by default and its certificate comes from a
          # read-only bind of deploy/docker/apns-keys.
          "${compose[@]}" config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]["server"]; e=s["environment"]; keys=("TELESRV_UPDATE_MANIFEST", "TELESRV_UPDATE_FILES_DIR", "TELESRV_UPDATE_ROOT_PUBLIC_KEY", "TELESRV_UPDATE_PUBLIC_URL"); assert all(k in e and not e[k] for k in keys), {k: e.get(k) for k in keys}; m={v["target"]: v for v in s["volumes"]}; assert sorted(m) == ["/etc/telesrv-apns", "/etc/telesrv-updates", "/var/lib/telesrv", "/var/lib/telesrv-updates"], sorted(m); a=m["/etc/telesrv-apns"]; assert a["type"] == "bind" and a.get("read_only") is True and a["source"].endswith("/deploy/docker/apns-keys"), a; assert str(e["TELESRV_APNS_ENABLED"]).lower() == "false", e["TELESRV_APNS_ENABLED"]; assert m["/var/lib/telesrv-updates"]["type"] == "volume" and not m["/var/lib/telesrv-updates"].get("read_only", False); k=m["/etc/telesrv-updates"]; assert k["type"] == "bind" and k.get("read_only") is True and k["source"].endswith("/deploy/docker/update-keys"), k; assert s["read_only"] is True'
          "${bridge[@]}" config --quiet
          "${bridge[@]}" config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); s=c["services"]; assert s["server"].get("network_mode") != "host"; assert s["admin"].get("network_mode") != "host"; assert len(s["server"].get("ports", [])) == 69; assert len(s["admin"].get("ports", [])) == 1; assert "admin_host_access" in s["admin"]["networks"]; assert not c["networks"]["admin_host_access"].get("internal", False); assert str(s["server"]["environment"]["TELESRV_TURN_RELAY_MAX_PORT"]) == "12563"'

      - name: Validate PowerShell launchers
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/new-docker-env.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/start-docker.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          foreach ($launcher in @("scripts/backup.ps1", "scripts/restore.ps1", "scripts/check-media.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($launcher, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Build application images
        run: |
          compose=(docker compose -p telesrv-main-ci --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml)
          "${compose[@]}" build --pull server admin

      - name: Start and wait for readiness
        run: docker compose -p telesrv-main-ci --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml up -d --no-build --wait --wait-timeout 600

      - name: Verify runtime and media listeners
        run: |
          compose=(docker compose -p telesrv-main-ci --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml)
          for service in server admin; do
            container_id="$("${compose[@]}" ps --quiet "$service")"
            test -n "$container_id"
            test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
            test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
            test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id")" = '["ALL"]'
            test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$container_id")" = "1024"
            test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container_id")" = '["no-new-privileges:true"]'
            test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$container_id")" = "host"
          done
          # The wallet state directory holds per-account key material and
          # NewFileStore refuses anything group- or world-accessible. Assert the
          # mode on the mounted volume rather than trusting the image build: a
          # permissive mode here is what stopped the server from booting.
          server_container="$("${compose[@]}" ps --quiet server)"
          test "$(docker exec "$server_container" stat -c %a /var/lib/telesrv/wallet)" = "700"
          # Operators publish desktop updates with `docker compose exec server
          # telesrv-update publish`, so the image must ship an executable
          # telesrv-update and the update volume must belong to the container user.
          docker exec "$server_container" sh -c 'test -x "$(command -v telesrv-update)"'
          docker exec "$server_container" telesrv-update publish -h
          test "$(docker exec "$server_container" stat -c %u:%g /var/lib/telesrv-updates)" = "10001:10001"
          # The update root public key mount is read-only: the server user must
          # not be able to replace the trust anchor.
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/telesrv-updates"}}{{.RW}}{{end}}{{end}}' "$server_container")" = "false"
          if docker exec "$server_container" touch /etc/telesrv-updates/write-probe; then exit 1; fi
          curl --fail --silent --show-error http://127.0.0.1:2401/healthz | grep -qx ok
          curl --fail --silent --show-error http://127.0.0.1:2600/ >/dev/null
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2400'
          python3 - <<'PY'
          import os
          import socket
          import struct

          transaction_id = os.urandom(12)
          request = struct.pack("!HHI12s", 0x0001, 0, 0x2112A442, transaction_id)
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as client:
              client.settimeout(5)
              client.sendto(request, ("127.0.0.1", 12400))
              response, _ = client.recvfrom(2048)
          message_type, _, cookie = struct.unpack("!HHI", response[:8])
          assert message_type == 0x0101, hex(message_type)
          assert cookie == 0x2112A442, hex(cookie)
          assert response[8:20] == transaction_id
          PY
          server_logs="$("${compose[@]}" logs --no-color server)"
          case "$server_logs" in *"sfu listening"*) ;; *) echo "Embedded SFU did not become ready" >&2; exit 1 ;; esac
          case "$server_logs" in *"turn listening"*) ;; *) echo "Embedded TURN did not become ready" >&2; exit 1 ;; esac
          case "$server_logs" in *"live stream rtmp ingest listening"*) ;; *) echo "RTMP listener did not become ready" >&2; exit 1 ;; esac

      - name: Show logs on failure
        if: failure()
        run: docker compose -p telesrv-main-ci --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml logs --no-color --tail 200

      - name: Remove isolated stack
        if: always()
        run: docker compose -p telesrv-main-ci --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml down --volumes --remove-orphans
