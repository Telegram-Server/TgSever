# telesrv 第一阶段三方依赖（开发用）。
#
#   启动：  docker compose up -d
#   状态：  docker compose ps
#   关停：  docker compose down          （保留数据卷）
#   清空：  docker compose down -v        （连数据卷一起删，重置 schema/数据）
#
# main / v2 分别使用 telesrv_main / telesrv_v2；legacy telesrv 库只保留兼容和人工迁移。
# server 端连接串见各分支 internal/config/config.go 的默认值（localhost:5432 / localhost:6399）。
name: telesrv

services:
  postgres:
    image: postgres:17-alpine
    container_name: telesrv-postgres
    # 全库已去分区（普通表），max_locks_per_transaction 默认 64 已够；512 仅留余量，对内存近乎零开销。
    # pg_stat_statements：聚合各 SQL 的累计/平均耗时与调用次数，用于定位 postgres 容器 CPU 热点
    # （telesrv 是宿主进程，docker stats 里的 CPU 尖峰是本容器）。需 CREATE EXTENSION 后才有视图：
    #   docker exec -i telesrv-postgres psql -U telesrv -d telesrv -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
    command:
      - "postgres"
      - "-c"
      - "max_locks_per_transaction=512"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
    environment:
      POSTGRES_DB: telesrv_main
      POSTGRES_USER: telesrv
      POSTGRES_PASSWORD: ${TELESRV_POSTGRES_PASSWORD:-telesrv}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telesrv -d telesrv_main"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 可选。go test 默认自己启动私有 PostgreSQL（见 internal/store/postgres/pgtest），不需要它；
  # 想让测试连一个固定实例调试时才用。集成测试专用：数据放 tmpfs、关掉 fsync 等持久化保证，
  # 只在 test profile 下启动：
  #   docker compose --profile test up -d postgres-test
  #   TELESRV_TEST_POSTGRES_DSN=postgres://telesrv:telesrv@127.0.0.1:5433/telesrv_test?sslmode=disable
  # 测试每个用例从模板库克隆一个库、用完删除（见 internal/store/postgres/pgtest）；落盘实例上
  # CREATE/DROP DATABASE 写 WAL、触发 checkpoint，整包测试被磁盘卡住。内存实例把
  # store/postgres 整包从约 380 秒降到约 110 秒。容器重启即清空，不要指向它跑开发服务。
  postgres-test:
    image: postgres:17-alpine
    container_name: telesrv-postgres-test
    profiles: ["test"]
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "max_locks_per_transaction=512"
      - "-c"
      - "shared_buffers=512MB"
    environment:
      POSTGRES_DB: telesrv_test
      POSTGRES_USER: telesrv
      POSTGRES_PASSWORD: telesrv
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,size=8g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telesrv -d telesrv_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: telesrv-redis
    environment:
      REDIS_PASSWORD: ${TELESRV_REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "6399:6379"   # 宿主 6379 常被其他项目占用，telesrv 对外用 6399（容器内仍 6379）
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
